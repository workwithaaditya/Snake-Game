<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background with cyberpunk gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7800ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="snakeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00aa00;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background circle with neon border -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#ff00ff" stroke-width="2"/>
  
  <!-- Snake head (stylized) -->
  <ellipse cx="32" cy="24" rx="14" ry="16" fill="url(#snakeGrad)" stroke="#00ff00" stroke-width="1.5"/>
  
  <!-- Snake eyes with cyberpunk glow -->
  <circle cx="26" cy="20" r="3" fill="#ffff00" stroke="#ff00ff" stroke-width="1"/>
  <circle cx="38" cy="20" r="3" fill="#ffff00" stroke="#ff00ff" stroke-width="1"/>
  
  <!-- Snake fangs (evil grin) -->
  <polygon points="30,30 28,35 32,32" fill="#ff0000" stroke="#ff0000" stroke-width="0.5"/>
  <polygon points="34,30 36,35 32,32" fill="#ff0000" stroke="#ff0000" stroke-width="0.5"/>
  
  <!-- Snake body segment (coil) -->
  <circle cx="32" cy="42" r="10" fill="url(#snakeGrad)" stroke="#00ff00" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Neon accent lines (cyberpunk effect) -->
  <line x1="10" y1="32" x2="18" y2="32" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
  <line x1="46" y1="32" x2="54" y2="32" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
</svg>